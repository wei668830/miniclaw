[project]
name = "miniclaw"
version = "1.1.2"
description = "mini claw"
authors = [
    {name = "ztcz",email = "contact@ztenith.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "loguru (>=0.7.3,<0.8.0)",
    "shortuuid (>=1.0.13,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "litellm (>=1.82.6,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "mss (>=10.2.0,<11.0.0)",
    "prompt-toolkit (>=3.0.52,<4.0.0)",
    "aioconsole (>=0.8.2,<0.9.0)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "rich (>=14.0.0,<16.0.0)"

]

[project.optional-dependencies]
# 浏览器操作工具（browser_control）所需，按需安装：uv sync --extra browser
browser = [
    "playwright (>=1.40.0,<2.0.0)",
]

[project.scripts]
miniclaw = "miniclaw.__main__:main"

[dependency-groups]
dev = [
    "toml (>=0.10.2,<0.11.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
]

[build-system]
# uv 官方构建后端：只需 uv 自身的构建后端包，构建时无需再引入 poetry-core
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
# 与 Poetry 的 dev 组等价：uv sync 默认同步 dev 组
default-groups = ["dev"]

# 国内镜像源（等价原 [[tool.poetry.source]] priority = "primary"）
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
